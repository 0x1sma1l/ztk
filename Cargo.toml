[package]
name = "zet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A local-first, keyboard-driven Markdown note manager for the terminal"
license = "MIT"
repository = "https://github.com/0x1sma1l/zet"
homepage = "https://github.com/0x1sma1l/zet"
readme = "README.md"
keywords = ["cli", "markdown", "notes", "tui", "zettelkasten"]
categories = ["command-line-utilities", "text-editors"]
exclude = [".github/", "docs/", "notes/"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
chrono = "0.4"
termimad = "0.25"
serde = "1.0.219"
serde_yaml = "0.9.34"
shlex = "1.3.0"
ratatui = "0.29.0"
crossterm = "0.29.0"
color-eyre = "0.6.5"
colored = "3.0.0"
fuzzy-matcher = "0.3.7"
thiserror = "2.0.12"
tempfile = "3"
toml = "0.9"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = "symbols"
