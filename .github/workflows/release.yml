name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v0.1.0

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="ztk-${RELEASE_TAG}-${TARGET}.tar.gz"
          tar -C "target/${TARGET}/release" -czf "${archive}" ztk
          shasum -a 256 "${archive}" > "${archive}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ztk-${{ matrix.target }}
          path: |
            ztk-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz
            ztk-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz.sha256

  publish-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${RELEASE_TAG}" artifacts/* --generate-notes --verify-tag
